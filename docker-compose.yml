x-common-env: &common-env
  LIVEKIT_URL: ${LIVEKIT_URL}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
  # DEV-SAFE fallbacks (used only when the var is unset). Prod sets these via
  # .env.prod: VOXCPM2_ENABLED=true, VOXCPM2_DEVICE=cuda. See docs/ENV_PROFILES.md.
  VOXCPM2_ENABLED: ${VOXCPM2_ENABLED:-false}
  VOXCPM2_MODEL_NAME: ${VOXCPM2_MODEL_NAME:-openbmb/VoxCPM2}
  VOXCPM2_DEVICE: ${VOXCPM2_DEVICE:-cpu}
  VOXCPM2_REFERENCE_AUDIO: ${VOXCPM2_REFERENCE_AUDIO:-/app/assets/voice_reference_processed.wav}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:31b-cloud}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
  OLLAMA_TOKEN: ${OLLAMA_TOKEN:-}
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-viona_faq}
  # Embedding di-offload ke Ollama (lihat embeddings.py). qwen3-embedding:0.6b = 1024-dim.
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
  REDIS_URL: redis://redis:6379/0
  REDIS_SESSION_TTL: "3600"
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
  TWILIO_SIP_TRUNK_SID: ${TWILIO_SIP_TRUNK_SID:-}
  WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-large-v3}
  WHISPER_LANGUAGE: "id"
  # DEV-SAFE: auto picks CPU when no CUDA; int8 is valid on CPU (float16 is not).
  # Prod sets WHISPER_DEVICE=cuda, WHISPER_COMPUTE_TYPE=float16 via .env.prod.
  WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
  WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  ENVIRONMENT: ${ENVIRONMENT:-production}

services:

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: viona-nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
      livekit-agent:
        condition: service_started
    networks:
      - viona-net
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # ── Next.js frontend ────────────────────────────────────────────────────────
  # Gunakan: docker compose build --build-arg CACHE_BUST=$(date +%s) frontend
  # untuk memaksa rebuild penuh jika cache Docker tidak terinvalidasi.
  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
      args:
        # Ubah nilai ini (atau lewat --build-arg) untuk force-rebuild image
        CACHE_BUST: ${CACHE_BUST:-1}
    container_name: viona-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
    environment:
      API_URL: "http://api:8000" # For server-side Next.js rewrites to backend
      NEXT_PUBLIC_API_URL: ""   # empty = same-origin via nginx proxy
      # Next.js standalone server binds to $HOSTNAME by default.
      # In Docker this is the container hostname (e.g. ad2929...), which does NOT
      # listen on 127.0.0.1 and makes our healthcheck fail with "connection refused".
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - viona-net
    healthcheck:
      # BusyBox wget resolves "localhost" to ::1 first on some images, but the
      # server may only listen on IPv4. Use 127.0.0.1 to avoid IPv6 mismatch.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/dashboard/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  # ── Laravel Website (LMS Dummy) ─────────────────────────────────────────────
  website:
    image: php:8.2-cli
    container_name: viona-website
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./website:/app
    # Run artisan serve on 0.0.0.0 to make it accessible to Nginx proxy
    command: php artisan serve --host=0.0.0.0 --port=8002
    networks:
      - viona-net
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: viona-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
    environment:
      <<: *common-env
      VIONA_MODE: api
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_SECRET_KEY: ${API_SECRET_KEY:-change-me-in-production}
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      # Qdrant/RAG is optional (parked). Retriever init is best-effort and /chat
      # degrades gracefully when absent. Enable with `--profile rag`.
    networks:
      - viona-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Beri waktu lebih: saat boot, model embedding di-pre-load (load dari volume).
      start_period: 120s
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "5" }

  # ── Pipecat dispatch server (receives LiveKit webhooks, spawns bots) ─────────
  livekit-agent:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: viona-agent
    restart: unless-stopped
    # NO hard memory limit on purpose: footprint is highly variable — idle in dev
    # (pipeline never spawns), but loads Whisper large-v3 + VoxCPM2 in prod (GPU).
    # A wrong cap would OOM-kill the core voice service. Set a prod-tuned limit
    # (e.g. deploy.resources.limits.memory) once real model RSS is measured (task E/G).
    environment:
      <<: *common-env
      VIONA_MODE: agent
    volumes:
      - whisper-cache:/app/.cache/whisper
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      # Qdrant/RAG optional (parked) — enable with `--profile rag`.
    networks:
      - viona-net
    # Agent HTTP server (metrics/health) berjalan di port 8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "5" }

  # ── Ollama LLM inference ────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.13.1-rc0
    container_name: viona-ollama
    restart: unless-stopped
    # LLM is cloud (gemma4:31b-cloud); this container only routes + runs the local
    # embedding model. 4G is ample. Raise only if you host a local LLM here.
    deploy:
      resources:
        limits:
          memory: 4096M
    environment:
      # Inject token ke dalam container ollama agar bisa merutekan ke Ollama Cloud
      OLLAMA_TOKEN: ${OLLAMA_TOKEN:-${OLLAMA_API_KEY:-}}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - viona-net
    healthcheck:
      # Image ollama/ollama tidak menyertakan curl/wget, jadi pakai binary `ollama`
      # sendiri. `ollama list` menghubungi server lokal (11434) dan exit 0 bila hidup.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  # ── Qdrant vector database ──────────────────────────────────────────────────
  # OPTIONAL: RAG is parked (LMS pivot uses context-injection, not vector search).
  # Off by default; start with `docker compose --profile rag up`.
  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: viona-qdrant
    restart: unless-stopped
    profiles: ["rag"]
    deploy:
      resources:
        limits:
          memory: 1024M
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    networks:
      - viona-net
    healthcheck:
      # Qdrant image doesn't ship curl/wget; use bash TCP check instead.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # ── Redis session cache ─────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: viona-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    volumes:
      - redis-data:/data
    networks:
      - viona-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

networks:
  viona-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  ollama-models:
  qdrant-data:
  redis-data:
  whisper-cache:
