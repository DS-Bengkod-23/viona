[project]
name = "viona-api"
version = "1.0.0"
description = "Viona – Indonesian Realtime Voice AI Customer Support"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # LiveKit core
    "livekit-agents>=1.5.8",
    "livekit-plugins-silero>=1.5.8",
    "livekit-plugins-openai>=1.5.8",
    "livekit-plugins-noise-cancellation>=0.2.5",
    "livekit-plugins-turn-detector>=1.5.8",
    # TTS – VoxCPM2 voice cloning
    "voxcpm>=0.3.0",
    "soundfile>=0.12.0",
    # STT – faster-whisper (self-hosted, GPU-optional)
    "faster-whisper>=1.1.0",
    "ctranslate2>=4.4.0",
    # RAG
    "qdrant-client[fastembed]>=1.9.0",
    "fastembed>=0.3.6",
    "pypdf>=5.1.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Session / cache
    "redis[hiredis]>=5.2.0",
    # Observability
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    # Config / utilities
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "httpx>=0.28.0",
    "numpy>=1.26.0,<2.0.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.20",
]

[project.scripts]
viona-agent  = "agents.worker:main"
viona-api    = "api.app:main"
viona-ingest = "scripts.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agents", "api", "stt", "llm", "tts",
    "rag", "prompts", "services",
    "core", "utils",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
